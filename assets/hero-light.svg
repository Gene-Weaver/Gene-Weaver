  <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset="1" stop-color="#0969da" stop-opacity=".45"/></linearGradient>
  <clipPath id="sheetclip"><rect x="56" y="22" width="206" height="276" rx="6"/></clipPath>
</defs>
<rect width="1200" height="320" fill="#ffffff"/>
<rect width="1200" height="320" fill="url(#g)"/>
