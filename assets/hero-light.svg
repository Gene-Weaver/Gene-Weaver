<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Will Weaver: machine learning for natural history collections">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .cyc { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .outline { stroke-dasharray: 1; stroke-dashoffset: 1; animation-name: draw; }
  @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1 } 26% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 96%,100% { stroke-dashoffset: 0; opacity: 0 } }
  .mask { opacity: 0; animation-name: mask; }
  @keyframes mask { 0%,26% { opacity: 0 } 33% { opacity: .38 } 88% { opacity: .38 } 96%,100% { opacity: 0 } }
  .scan { animation-name: scan; animation-timing-function: linear; }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0 } 3% { opacity: .9 } 26% { transform: translateY(268px); opacity: .9 } 29%,100% { transform: translateY(268px); opacity: 0 } }
  .pop1, .pop2, .pop3, .pop4 { opacity: 0; }
  .pop1 { animation-name: pop1; } .pop2 { animation-name: pop2; } .pop3 { animation-name: pop3; } .pop4 { animation-name: pop4; }
  @keyframes pop1 { 0%,34% { opacity: 0 } 38%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
  @keyframes pop2 { 0%,41% { opacity: 0 } 45%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
  @keyframes pop3 { 0%,48% { opacity: 0 } 52%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
  @keyframes pop4 { 0%,56% { opacity: 0 } 60%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
  .midrib { stroke-dasharray: 1; stroke-dashoffset: 1; animation-name: rib; }
  @keyframes rib { 0%,45% { stroke-dashoffset: 1; opacity: 1 } 52%,88% { stroke-dashoffset: 0; opacity: 1 } 96%,100% { opacity: 0 } }
  .pollen { fill: #1a7f37; opacity: 0; animation: drift linear infinite; }
  @keyframes drift { 0% { transform: translate(0,0); opacity: 0 } 15% { opacity: .55 } 85% { opacity: .35 } 100% { transform: translate(-40px,-230px); opacity: 0 } }
  .rise { opacity: 0; animation: rise 1s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
</style>
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eaeef2" stroke-width="1"/></pattern>
